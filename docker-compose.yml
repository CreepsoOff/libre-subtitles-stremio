version: "3.8"

services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    networks:
      - proxy

  libresubs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libre-subtitles
    environment:
      NODE_ENV: production
      PORT: 7000
    expose:
      - "7000"
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.libresubs.rule=Host(`sub.creepso.com`)"
      - "traefik.http.routers.libresubs.entrypoints=websecure"
      - "traefik.http.routers.libresubs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.libresubs.service=libresubs"
      - "traefik.http.services.libresubs.loadbalancer.server.port=7000"
      - "traefik.http.routers.libresubs-web.rule=Host(`sub.creepso.com`)"
      - "traefik.http.routers.libresubs-web.entrypoints=web"
      - "traefik.http.routers.libresubs-web.middlewares=libresubs-https-redirect"
      - "traefik.http.middlewares.libresubs-https-redirect.redirectscheme.scheme=https"

volumes:
  traefik-certificates:

networks:
  proxy:
    external: false
