name: Release on commit message

on:
  push:
    branches:
      - new1             # adapte si tu veux le faire sur master plus tard
    # On peut ignorer les commits déjà générés par le workflow
    paths-ignore:
      - README.md        # optionnel
  workflow_dispatch:      # pour déclencher manuellement si besoin

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write    # nécessaire pour pousser commit et tag
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # indispensable pour créer/mettre à jour les tags

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract version from commit message
        id: version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ $COMMIT_MSG =~ Release[[:space:]]([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "Commit message does not contain a semantic version."
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release script
        run: npm run release -- --version ${{ steps.version.outputs.version }}

      - name: Push commit and tag
        run: git push origin HEAD --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
